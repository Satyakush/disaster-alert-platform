<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Disaster Alerts</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .alert {
      background: #fff;
      padding: 16px;
      margin-bottom: 12px;
      border-left: 6px solid red;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .high { border-color: #d32f2f; }
    .medium { border-color: #f9a825; }
    .low { border-color: #388e3c; }
    .meta {
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>

  <h1>🚨 Live Disaster Alerts</h1>
  <div id="alerts"></div>

  <script>
    const API_URL = "http://localhost:5000/api/alerts"; // adjust if needed

    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById("alerts");

        if (data.alerts.length === 0) {
          container.innerHTML = "<p>No alerts available</p>";
          return;
        }

        data.alerts.forEach(alert => {
          const div = document.createElement("div");
          div.className = `alert ${alert.severity}`;

          div.innerHTML = `
            <h3>🚨 ${alert.title.toUpperCase()}</h3>
            <p>${alert.description}</p>
            <p class="meta">
              📍 ${alert.location} |
              🌪️ ${alert.disasterType.toUpperCase()} |
              ⚠️ ${alert.severity.toUpperCase()}
            </p>
          `;

          container.appendChild(div);
        });
      })
      .catch(err => {
        console.error(err);
        document.getElementById("alerts").innerHTML =
          "<p>Failed to load alerts</p>";
      });
  </script>

</body>
</html>
